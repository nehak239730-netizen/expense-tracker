<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Expense Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="topbar">
        <h1>Expense Tracker</h1>
        <p>Record what you spend, then see where the money went.</p>
    </header>

    <main class="layout">
        <!-- ===== Add / edit form ===== -->
        <section class="panel form-panel" aria-labelledby="form-title">
            <h2 id="form-title">Add expense</h2>

            <form id="expense-form" novalidate>
                <label for="title">Title</label>
                <input id="title" name="title" type="text" maxlength="100" placeholder="Lunch at office canteen" required>

                <div class="row">
                    <div>
                        <label for="amount">Amount (INR)</label>
                        <input id="amount" name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="250.00" required>
                    </div>
                    <div>
                        <label for="date">Date</label>
                        <input id="date" name="date" type="date" required>
                    </div>
                </div>

                <label for="category">Category</label>
                <input id="category" name="category" type="text" maxlength="50" list="category-list" placeholder="Food" required>

                <label for="description">Description <span class="optional">(optional)</span></label>
                <textarea id="description" name="description" rows="3" maxlength="500" placeholder="Anything worth remembering"></textarea>

                <p id="form-error" class="form-error" role="alert" hidden></p>

                <div class="actions">
                    <button type="submit" id="save-btn" class="btn primary">Save expense</button>
                    <button type="button" id="cancel-btn" class="btn ghost" hidden>Cancel edit</button>
                </div>
            </form>
        </section>

        <!-- ===== Dashboard ===== -->
        <section class="ledger" aria-label="Expense dashboard">
            <div class="summary" aria-live="polite">
                <div class="summary-main">
                    <span class="summary-label">Total spent</span>
                    <strong id="stat-total" class="summary-total">&#8377;0.00</strong>
                </div>
                <div class="summary-side">
                    <div>
                        <span class="summary-label">Transactions</span>
                        <strong id="stat-count">0</strong>
                    </div>
                    <div>
                        <span class="summary-label">Average expense</span>
                        <strong id="stat-average">&#8377;0.00</strong>
                    </div>
                </div>
            </div>

            <form id="filter-form" class="panel filters" aria-label="Filter expenses">
                <div>
                    <label for="filter-start">From</label>
                    <input id="filter-start" type="date">
                </div>
                <div>
                    <label for="filter-end">To</label>
                    <input id="filter-end" type="date">
                </div>
                <div>
                    <label for="filter-category">Category</label>
                    <input id="filter-category" type="text" list="category-list" placeholder="All categories">
                </div>
                <div class="filter-actions">
                    <button type="submit" class="btn primary">Apply filters</button>
                    <button type="button" id="clear-filters" class="btn ghost">Clear</button>
                </div>
            </form>

            <div class="panel table-panel">
                <div class="table-scroll">
                    <table>
                        <thead>
                            <tr>
                                <th scope="col">Date</th>
                                <th scope="col">Expense</th>
                                <th scope="col">Category</th>
                                <th scope="col" class="num">Amount</th>
                                <th scope="col"><span class="visually-hidden">Actions</span></th>
                            </tr>
                        </thead>
                        <tbody id="expense-rows"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <datalist id="category-list">
        <option value="Food"></option>
        <option value="Transport"></option>
        <option value="Shopping"></option>
        <option value="Bills"></option>
        <option value="Health"></option>
        <option value="Entertainment"></option>
        <option value="Other"></option>
    </datalist>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script src="js/app.js"></script>
</body>
</html>
