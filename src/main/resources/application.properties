spring.application.name=expense-tracker
server.port=8081

# ---- Database (values come from environment variables; never hard-code passwords) ----
# Local default connects to MySQL on localhost:3306 and auto-creates the database.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/expense_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ---- JPA / Hibernate ----
# "update" creates/updates tables automatically. Great for learning; use Flyway/Liquibase in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- Safe error output ----
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
